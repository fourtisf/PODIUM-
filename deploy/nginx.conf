# Nginx templates for Podium. Replace <DOMAIN> and paths, then run: nginx -t && systemctl reload nginx
# Run certbot afterwards to add TLS and the HTTP to HTTPS redirect.

# ---------------------------------------------------------------------------
# podium-static: Phase 0. Serves the single prototype file.
# Put prototype/podium-v9.html at /var/www/podium/index.html
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name <DOMAIN>;

    root /var/www/podium;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}

